<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberStorage // Private Cloud</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent: #00ffcc;
      --accent-hover: #00b386;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --danger: #ef4444;
      --warning: #ffc107;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 255, 204, 0.05);
      border: 1px solid var(--border);
    }

    h1, h2 {
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header-flex h1 {
      font-size: 1.5rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-flex h1::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    /* Sembunyikan layar secara default */
    #loginScreen, #setupScreen, #appScreen {
      display: none;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    .btn-warning {
      background-color: var(--warning);
      color: #000;
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .upload-section {
      background: #0b0f19;
      margin-bottom: 30px;
      padding: 30px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    #selectedFileName {
      color: var(--text-muted);
      margin: 15px 0;
      font-style: italic;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.02);
    }

    td a {
      color: var(--accent);
      text-decoration: none;
    }
    td a:hover {
      text-decoration: underline;
    }

    .status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--accent);
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. LAYAR LOGIN FIREBASE -->
  <div id="loginScreen">
    <h2>System Access // Login</h2>
    <p style="color: var(--text-muted); margin-bottom: 25px;">Masukkan akun Firebase Anda untuk masuk.</p>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="user@domain.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="login()">Inisialisasi Masuk</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- 2. LAYAR SETUP GITHUB TOKEN DI DALAM APLIKASI -->
  <div id="setupScreen">
    <h2>Pengaturan Token GitHub (API Key)</h2>
    <p style="color: var(--text-muted); margin-bottom: 25px;">Masukkan detail GitHub Anda. Data ini akan disimpan aman di Firestore Anda.</p>
    <div class="form-group">
      <label>Username GitHub</label>
      <input type="text" id="gitUsername" placeholder="appvena">
    </div>
    <div class="form-group">
      <label>Nama Repository</label>
      <input type="text" id="gitRepo" placeholder="private">
    </div>
    <div class="form-group">
      <label>GitHub Token (ghp_...)</label>
      <input type="password" id="gitToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <button class="btn-primary" onclick="saveGitHubKeys()">Simpan Pengaturan</button>
    <button class="btn-danger" onclick="logout()" style="margin-left: 10px;">Keluar</button>
    <div id="setupStatus" class="status"></div>
  </div>

  <!-- 3. LAYAR UTAMA DASHBOARD -->
  <div id="appScreen">
    <div class="header-flex">
      <h1>CyberStorage <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">[Node Aktif]</span></h1>
      <div>
        <button class="btn-warning" onclick="resetGitHubKeys()">Ubah Token</button>
        <button class="btn-danger" onclick="logout()">Keluar</button>
      </div>
    </div>
    
    <div class="upload-section">
      <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Pilih Berkas / Foto</button>
      <input type="file" id="fileInput" onchange="showFileName()">
      <p id="selectedFileName">Tidak ada berkas yang dipilih</p>
      <button id="uploadBtn" class="btn-primary" style="display: none;" onclick="uploadToGitHubAndFirebase()">Unggah ke Cloud</button>
      <div id="status" class="status"></div>
    </div>

    <h2>Direktori Berkas</h2>
    <table>
      <thead>
        <tr>
          <th>Nama Berkas</th>
          <th>Ukuran</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="fileTableBody">
        <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Script Utama -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBYyVRU9cweEaniUkM3ZF2YeHhdxo3WrUA",
    authDomain: "privatedatasaya.firebaseapp.com",
    projectId: "privatedatasaya",
    storageBucket: "privatedatasaya.firebasestorage.app",
    messagingSenderId: "842911791149",
    appId: "1:842911791149:web:4d1fec084ed8caa9d1a0a4"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let githubConfigData = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await checkGitHubSettings(user.uid);
    } else {
      showScreen('loginScreen');
    }
  });

  window.login = function() {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    const stat = document.getElementById('loginStatus');
    stat.textContent = "> Menghubungkan...";

    signInWithEmailAndPassword(auth, email, pass).catch(err => {
      stat.textContent = "> Gagal: " + err.message;
    });
  };

  window.logout = () => signOut(auth);

  async function checkGitHubSettings(uid) {
    try {
      const docRef = doc(db, 'settings', uid);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        githubConfigData = docSnap.data();
        showScreen('appScreen');
        loadFiles();
      } else {
        showScreen('setupScreen'); // Form input token akan muncul di sini
      }
    } catch (err) {
      console.error(err);
      showScreen('setupScreen');
    }
  }

  window.saveGitHubKeys = async function() {
    const user = auth.currentUser;
    if (!user) return;

    const config = {
      username: document.getElementById('gitUsername').value.trim(),
      repo: document.getElementById('gitRepo').value.trim(),
      token: document.getElementById('gitToken').value.trim()
    };

    if (!config.username || !config.repo || !config.token) {
      document.getElementById('setupStatus').textContent = "> Harap isi semua kolom!";
      return;
    }

    document.getElementById('setupStatus').textContent = "> Menyimpan ke Firestore...";
    
    try {
      await setDoc(doc(db, 'settings', user.uid), config);
      await checkGitHubSettings(user.uid);
    } catch (err) {
      document.getElementById('setupStatus').textContent = "> Gagal menyimpan: " + err.message;
    }
  };

  window.resetGitHubKeys = async function() {
    const user = auth.currentUser;
    if (user && confirm("Ingin mengubah pengaturan token GitHub?")) {
      await deleteDoc(doc(db, 'settings', user.uid));
      checkGitHubSettings(user.uid);
    }
  };

  function showScreen(id) {
    ['loginScreen', 'setupScreen', 'appScreen'].forEach(s => {
      document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
    });
  }

  window.showFileName = function() {
    const input = document.getElementById('fileInput');
    if (input.files.length > 0) {
      document.getElementById('selectedFileName').textContent = input.files[0].name;
      document.getElementById('uploadBtn').style.display = 'inline-block';
    }
  };

  window.uploadToGitHubAndFirebase = async function() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    const stat = document.getElementById('status');
    if (!file || !githubConfigData) return;

    stat.textContent = "> Membaca berkas...";

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async function() {
      const base64Content = reader.result.split(',')[1];
      const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
      const githubPath = `uploads/${fileName}`;

      stat.textContent = "> Mengirim ke GitHub API...";

      try {
        const response = await fetch(`https://api.github.com/repos/${githubConfigData.username}/${githubConfigData.repo}/contents/${githubPath}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${githubConfigData.token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: `Upload file: ${file.name}`,
            content: base64Content
          })
        });

        if (!response.ok) throw new Error("Gagal mengirim ke GitHub (Periksa kembali Token & Nama Repository Anda)");

        const fileUrl = `https://raw.githubusercontent.com/${githubConfigData.username}/${githubConfigData.repo}/main/${githubPath}`;

        stat.textContent = "> Menyinkronkan ke database...";

        await addDoc(collection(db, 'user_files'), {
          fileName: file.name,
          fileUrl: fileUrl,
          fileSize: (file.size / (1024 * 1024)).toFixed(2) + " MB",
          createdAt: serverTimestamp()
        });

        stat.textContent = "> Berhasil diunggah!";
        fileInput.value = "";
        document.getElementById('selectedFileName').textContent = "Tidak ada berkas yang dipilih";
        document.getElementById('uploadBtn').style.display = 'none';

      } catch (err) {
        console.error(err);
        stat.textContent = "> Error: " + err.message;
      }
    };
  };

  function loadFiles() {
    const q = query(collection(db, 'user_files'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      const tbody = document.getElementById('fileTableBody');
      tbody.innerHTML = '';
      
      if(snap.empty) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Direktori kosong.</td></tr>`;
        return;
      }

      snap.forEach(document => {
        const d = document.data();
        tbody.innerHTML += `<tr>
          <td>${d.fileName}</td>
          <td>${d.fileSize}</td>
          <td><a href="${d.fileUrl}" target="_blank" download>Unduh</a></td>
        </tr>`;
      });
    });
  }
</script>

</body>
</html>
